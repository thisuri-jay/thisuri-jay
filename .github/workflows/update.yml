name: Update profile

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow numpy

      - name: Generate SVGs
        env:
          # A personal token (secret GH_PAT) also counts private contributions.
          # Without it, the built-in token still reads your public data.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/make_hero.py
          python scripts/make_stats.py
          python scripts/make_projects.py

      - name: Commit changed SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile SVGs"
          git push

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#a855f7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22e4ff&color_dots=#0d1433,#3b1d7a,#6d34c9,#a855f7,#22e4ff

      - name: Publish snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
