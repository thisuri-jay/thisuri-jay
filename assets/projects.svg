<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace">
<title>Projects</title>
<defs>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22e4ff"/><stop offset="1" stop-color="#a855f7"/>
  </linearGradient>
</defs>
<rect width="900" height="380" rx="14" fill="#070b1f"/><rect x="2" y="2" width="896" height="376" rx="13" fill="none" stroke="url(#neon)" stroke-width="1.6" filter="url(#glow)" opacity="0.9"/>
<text x="24" y="32" fill="#3dffa0" font-size="13">$ <tspan fill="#c9d6ff">./projects.sh --all</tspan></text>
<text x="876" y="32" fill="#6b7aa8" font-size="11" text-anchor="end">featured</text>

<g transform="translate(30 50)">
  <rect width="410" height="140" rx="10" fill="#0d1433" stroke="url(#neon)" stroke-opacity=".7"/>
  <text x="18" y="32" fill="#22e4ff" font-size="16" font-weight="bold" filter="url(#glow)">SmartJourney<tspan fill="#a855f7">_</tspan></text>
  <text x="18" y="58" fill="#c9d6ff" font-size="12">AI tourism platform: hybrid RAG search,</text><text x="18" y="75" fill="#c9d6ff" font-size="12">Keycloak auth, E2E tests.</text>
  <rect x="18" y="96" width="65" height="18" rx="9" fill="none" stroke="#a855f7" stroke-opacity=".7"/><text x="50.5" y="109" fill="#a855f7" font-size="11" text-anchor="middle">fastapi</text><rect x="89" y="96" width="79" height="18" rx="9" fill="none" stroke="#a855f7" stroke-opacity=".7"/><text x="128.5" y="109" fill="#a855f7" font-size="11" text-anchor="middle">langgraph</text><rect x="174" y="96" width="58" height="18" rx="9" fill="none" stroke="#a855f7" stroke-opacity=".7"/><text x="203.0" y="109" fill="#a855f7" font-size="11" text-anchor="middle">nestjs</text>
  <text x="18" y="130" fill="#6b7aa8" font-size="10">Present</text>
  
  <g transform="translate(360 56) rotate(-90)">
    <circle r="26" fill="none" stroke="#6b7aa8" stroke-opacity=".25" stroke-width="7"/>
    <circle r="26" fill="none" stroke="#3572A5" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="163.4" stroke-dashoffset="0.0" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="163.4;0.0" dur="1.4s" fill="freeze"/>
    </circle>
  </g>
  <text x="360" y="60" fill="#c9d6ff" font-size="11" text-anchor="middle">PY</text>
  <text x="360" y="102" fill="#6b7aa8" font-size="10" text-anchor="middle">Python</text>
</g>
<g transform="translate(460 50)">
  <rect width="410" height="140" rx="10" fill="#0d1433" stroke="url(#neon)" stroke-opacity=".7"/>
  <text x="18" y="32" fill="#22e4ff" font-size="16" font-weight="bold" filter="url(#glow)">HealthcareMonitoring<tspan fill="#a855f7">_</tspan></text>
  <text x="18" y="58" fill="#c9d6ff" font-size="12">Metrics, health checks and Grafana</text><text x="18" y="75" fill="#c9d6ff" font-size="12">dashboards for a vitals pipeline.</text>
  <rect x="18" y="96" width="86" height="18" rx="9" fill="none" stroke="#a855f7" stroke-opacity=".7"/><text x="61.0" y="109" fill="#a855f7" font-size="11" text-anchor="middle">prometheus</text><rect x="110" y="96" width="65" height="18" rx="9" fill="none" stroke="#a855f7" stroke-opacity=".7"/><text x="142.5" y="109" fill="#a855f7" font-size="11" text-anchor="middle">grafana</text><rect x="181" y="96" width="51" height="18" rx="9" fill="none" stroke="#a855f7" stroke-opacity=".7"/><text x="206.5" y="109" fill="#a855f7" font-size="11" text-anchor="middle">kafka</text>
  <text x="18" y="130" fill="#6b7aa8" font-size="10">2026</text>
  
  <g transform="translate(360 56) rotate(-90)">
    <circle r="26" fill="none" stroke="#6b7aa8" stroke-opacity=".25" stroke-width="7"/>
    <circle r="26" fill="none" stroke="#3572A5" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="163.4" stroke-dashoffset="0.0" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="163.4;0.0" dur="1.4s" fill="freeze"/>
    </circle>
  </g>
  <text x="360" y="60" fill="#c9d6ff" font-size="11" text-anchor="middle">PY</text>
  <text x="360" y="102" fill="#6b7aa8" font-size="10" text-anchor="middle">Python</text>
</g>
<g transform="translate(30 210)">
  <rect width="410" height="140" rx="10" fill="#0d1433" stroke="url(#neon)" stroke-opacity=".7"/>
  <text x="18" y="32" fill="#22e4ff" font-size="16" font-weight="bold" filter="url(#glow)">SkyNest_Hotels<tspan fill="#a855f7">_</tspan></text>
  <text x="18" y="58" fill="#c9d6ff" font-size="12">Hotel booking DB: schema, triggers,</text><text x="18" y="75" fill="#c9d6ff" font-size="12">views and reporting SQL.</text>
  <rect x="18" y="96" width="51" height="18" rx="9" fill="none" stroke="#a855f7" stroke-opacity=".7"/><text x="43.5" y="109" fill="#a855f7" font-size="11" text-anchor="middle">mysql</text><rect x="75" y="96" width="37" height="18" rx="9" fill="none" stroke="#a855f7" stroke-opacity=".7"/><text x="93.5" y="109" fill="#a855f7" font-size="11" text-anchor="middle">sql</text><rect x="118" y="96" width="121" height="18" rx="9" fill="none" stroke="#a855f7" stroke-opacity=".7"/><text x="178.5" y="109" fill="#a855f7" font-size="11" text-anchor="middle">database-design</text>
  <text x="18" y="130" fill="#6b7aa8" font-size="10">2025</text>
  
  <g transform="translate(360 56) rotate(-90)">
    <circle r="26" fill="none" stroke="#6b7aa8" stroke-opacity=".25" stroke-width="7"/>
    <circle r="26" fill="none" stroke="#ff4fd8" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="163.4" stroke-dashoffset="0.0" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="163.4;0.0" dur="1.4s" fill="freeze"/>
    </circle>
  </g>
  <text x="360" y="60" fill="#c9d6ff" font-size="11" text-anchor="middle">SQL</text>
  <text x="360" y="102" fill="#6b7aa8" font-size="10" text-anchor="middle">SQL</text>
</g>
<g transform="translate(460 210)">
  <rect width="410" height="140" rx="10" fill="#0d1433" stroke="url(#neon)" stroke-opacity=".7"/>
  <text x="18" y="32" fill="#22e4ff" font-size="16" font-weight="bold" filter="url(#glow)">Nanoprocessor<tspan fill="#a855f7">_</tspan></text>
  <text x="18" y="58" fill="#c9d6ff" font-size="12">VHDL nanoprocessor with testbenches for</text><text x="18" y="75" fill="#c9d6ff" font-size="12">arithmetic, overflow and zero flags.</text>
  <rect x="18" y="96" width="44" height="18" rx="9" fill="none" stroke="#a855f7" stroke-opacity=".7"/><text x="40.0" y="109" fill="#a855f7" font-size="11" text-anchor="middle">vhdl</text><rect x="68" y="96" width="58" height="18" rx="9" fill="none" stroke="#a855f7" stroke-opacity=".7"/><text x="97.0" y="109" fill="#a855f7" font-size="11" text-anchor="middle">vivado</text>
  <text x="18" y="130" fill="#6b7aa8" font-size="10">2024</text>
  
  <g transform="translate(360 56) rotate(-90)">
    <circle r="26" fill="none" stroke="#6b7aa8" stroke-opacity=".25" stroke-width="7"/>
    <circle r="26" fill="none" stroke="#3dffa0" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="163.4" stroke-dashoffset="0.0" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="163.4;0.0" dur="1.4s" fill="freeze"/>
    </circle>
  </g>
  <text x="360" y="60" fill="#c9d6ff" font-size="11" text-anchor="middle">VHDL</text>
  <text x="360" y="102" fill="#6b7aa8" font-size="10" text-anchor="middle">VHDL</text>
</g>
</svg>